name: Water
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Water:
    type: application
    platform: iOS
    sources: [Water]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.water
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Water
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
  WaterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WaterTests]
    dependencies:
      - target: Water
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
  WaterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WaterUITests]
    dependencies:
      - target: Water
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Water
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
schemes:
  Water:
    build:
      targets:
        Water: all
    test:
      targets:
        - WaterTests
        - WaterUITests
