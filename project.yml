name: TipJar
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  TipJar:
    type: application
    platform: iOS
    sources: [TipJar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tipjar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
  TipJarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TipJarUITests]
    dependencies:
      - target: TipJar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TipJar
        CODE_SIGNING_ALLOWED: NO
schemes:
  TipJar:
    build:
      targets:
        TipJar: all
    test:
      targets:
        - TipJarUITests
